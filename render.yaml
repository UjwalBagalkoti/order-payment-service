# Render Blueprint (https://render.com/docs/infrastructure-as-code).
# Render has no managed Kafka, so events run in "log" mode here; use docker-compose for the Kafka path.
databases:
  - name: orders-db
    databaseName: orders
    plan: free

services:
  - type: web
    name: order-payment-service
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: orders-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: orders-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: orders-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: orders-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: orders-db
          property: password
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: orders-cache
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: orders-cache
          property: port
      - key: EVENTS_TYPE
        value: log
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: orders-cache
    plan: free
    ipAllowList: []
