server:
  port: ${PORT:8080}

spring:
  application:
    name: order-payment-service
  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      properties:
        # Never let a Kafka outage hang a payment request for the default 60s.
        max.block.ms: 3000
    consumer:
      group-id: notifications
      auto-offset-reset: earliest
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Switch to "validate" once your build passes, to catch entity/schema drift.
      ddl-auto: none
  flyway:
    enabled: true

app:
  admin:
    # Optional: bootstraps the first ADMIN user on startup.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  jwt:
    # Override JWT_SECRET in any real environment (min 32 bytes).
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-ms: 3600000
  events:
    # kafka | log. Use "log" on hosts without a Kafka broker.
    type: ${EVENTS_TYPE:kafka}
  cache:
    enabled: ${CACHE_ENABLED:true}
  rate-limit:
    login-per-minute: 10
  payment:
    mock-failure-rate: 0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
